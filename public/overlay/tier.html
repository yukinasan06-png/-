<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ティア表</title>
<style>
  :root {
    --tile: 100px;
    --bg: #1f2024;
    --row-bg: #4a4d57;
    --pool-bg: #34363d;
    --line: #2a2b30;
    --accent: #8ab4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: #f2f2f4;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  body.transparent { background: transparent; }
  #app { padding: 14px 18px 18px; }

  #title { margin: 0 0 10px; font-size: 30px; font-weight: 800; text-align: center; letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #title:empty { display: none; }

  /* ---- 行 ---- */
  .tier { display: flex; margin-bottom: 10px; min-height: calc(var(--tile) + 8px); background: var(--row-bg); }
  .label {
    flex: 0 0 calc(var(--tile) * 1.4);
    display: flex; align-items: center; justify-content: center;
    padding: 6px; text-align: center; color: #111;
    font-size: 22px; font-weight: 600; line-height: 1.2;
    word-break: break-all; cursor: pointer;
  }
  .label.mid { font-size: 17px; }
  .label.small { font-size: 13px; }
  .label.light { color: #fff; }
  .items {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: 2px; padding: 4px; min-height: calc(var(--tile) + 8px);
  }

  /* ---- 画像タイル ---- */
  .tile { width: var(--tile); height: var(--tile); flex: 0 0 auto; cursor: grab; touch-action: none; background: #26272c; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
  .tile.placeholder { opacity: .3; outline: 2px dashed #fff; outline-offset: -2px; }
  .tile.ghost {
    position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; cursor: grabbing;
    box-shadow: 0 8px 24px rgba(0,0,0,.6); outline: 2px solid #fff;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  #add-row {
    display: block; width: 100%; margin: 0 0 14px; padding: 6px;
    background: transparent; color: #9a9ca6; border: 2px dashed #4a4d57; border-radius: 6px;
    font: inherit; font-size: 14px; cursor: pointer;
  }
  #add-row:hover { color: #fff; border-color: #777a86; }

  /* ---- ストック ---- */
  #pool-wrap { background: var(--pool-bg); border-radius: 6px; }
  .pool-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 14px; color: #c9cad2; }
  .pool-head .sp { flex: 1; }
  #pool { min-height: calc(var(--tile) + 8px); }
  #pool:empty::before {
    content: "「＋ 画像を追加」から画像を入れてください（ドラッグ＆ドロップ・Ctrl+V でも追加できます）";
    color: #8d8f99; font-size: 13px; padding: 8px;
  }
  body.pool-hidden #pool { display: none; }

  button.btn {
    background: #5a5d69; color: #fff; border: 0; border-radius: 6px; padding: 5px 10px;
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { background: #6b6f7d; }
  button.btn.primary { background: #3d6fd8; }
  button.btn.primary:hover { background: #4b7fe8; }
  button.btn.danger { background: #8e3b44; }
  button.btn.danger:hover { background: #a8464f; }
  button.btn.armed { background: #d9363e; }

  /* 操作ボタンを隠すモード */
  body.ui-hidden #add-row, body.ui-hidden .pool-head .ui { display: none; }
  body.ui-hidden #gear { opacity: .12; }
  body.ui-hidden #gear:hover { opacity: 1; }

  /* 表示専用（?view=1） */
  body.view #add-row, body.view #pool-wrap, body.view #gear { display: none; }
  body.view .label, body.view .tile { cursor: default; }

  #gear {
    position: fixed; top: 8px; right: 8px; z-index: 50; width: 34px; height: 34px;
    border: 0; border-radius: 50%; background: rgba(30,31,36,.85); color: #fff; font-size: 18px; cursor: pointer;
  }

  /* ---- 吹き出し（設定・行の編集） ---- */
  .pop {
    position: fixed; z-index: 100; width: 300px; max-width: calc(100vw - 16px);
    background: #2b2d33; border: 1px solid #555865; border-radius: 10px; padding: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.55); font-size: 13px;
  }
  .pop[hidden] { display: none; }
  .pop h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; }
  .pop h3 .x { margin-left: auto; background: none; border: 0; color: #aaa; font-size: 18px; cursor: pointer; }
  .pop .f { margin-bottom: 10px; }
  .pop .f > span { display: block; color: #aeb0ba; margin-bottom: 4px; }
  .pop input[type=text] {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #555865;
    background: #1d1e22; color: #fff; font: inherit; font-size: 14px; user-select: text; -webkit-user-select: text;
  }
  .pop input[type=range] { width: 100%; }
  .pop .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pop .seg { display: flex; gap: 4px; }
  .pop .seg button { flex: 1; }
  .pop .seg button.on { background: #3d6fd8; }
  .pop label.chk { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  .pop .hint { color: #8d8f99; font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .swatches button { width: 24px; height: 24px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatches button.on { border-color: #fff; }
  .swatches input[type=color] { width: 30px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }

  #trash {
    position: fixed; right: 16px; bottom: 16px; z-index: 900; display: none;
    padding: 18px 22px; border-radius: 12px; border: 2px dashed #e06c75;
    background: rgba(60,20,24,.9); color: #ffb3b9; font-size: 15px; font-weight: 600;
  }
  body.dragging #trash { display: block; }
  #trash.over { background: #c0392b; color: #fff; border-style: solid; }

  #drop-cover {
    position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,60,.75); border: 4px dashed var(--accent); color: #fff; font-size: 26px; font-weight: 700;
  }
  #drop-cover.on { display: flex; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 3000;
    background: rgba(20,20,24,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; }
  #conn {
    position: fixed; left: 8px; top: 8px; z-index: 3000; display: none;
    background: #8e3b44; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px;
  }
  #conn.on { display: block; }
</style>
</head>
<body>
<div id="app">
  <h1 id="title"></h1>
  <div id="rows"></div>
  <button id="add-row">＋ 行を追加</button>
  <section id="pool-wrap">
    <div class="pool-head">
      <span>ストック（未配置）<b id="pool-count">0</b>枚</span>
      <span class="sp"></span>
      <button class="btn primary ui" id="add-image">＋ 画像を追加</button>
      <button class="btn ui" id="toggle-pool">▼ 隠す</button>
    </div>
    <div id="pool" class="items" data-drop="pool"></div>
  </section>
</div>

<button id="gear" title="設定">⚙</button>

<div class="pop" id="settings" hidden>
  <h3>ティア表の設定 <button class="x" data-close>×</button></h3>
  <div class="f"><span>タイトル（空欄なら表示しません）</span><input type="text" id="opt-title" maxlength="60" placeholder="例：ラーメン ティア表"></div>
  <div class="f"><span>画像の大きさ：<b id="opt-size-v">100</b>px</span><input type="range" id="opt-size" min="40" max="240" step="10"></div>
  <div class="f"><span>画像を追加するときの正方形にする方法</span>
    <div class="seg" id="opt-fit">
      <button class="btn" data-fit="cover">中央を切り抜く</button>
      <button class="btn" data-fit="contain">全体を入れる（余白）</button>
    </div>
  </div>
  <div class="f">
    <label class="chk"><input type="checkbox" id="opt-hide-pool"> ストック（未配置の画像）を隠す</label>
    <label class="chk"><input type="checkbox" id="opt-hide-ui"> 操作ボタンを隠す（⚙ は薄く残ります）</label>
  </div>
  <div class="grid">
    <button class="btn" id="opt-add-image">＋ 画像を追加</button>
    <button class="btn" id="opt-add-row">＋ 行を追加</button>
    <button class="btn" id="opt-reset">全部ストックへ戻す</button>
    <button class="btn danger" id="opt-delete-all">画像を全部削除</button>
  </div>
  <p class="hint">
    ・画像はドラッグで行へ移動。右下の 🗑 に離すと削除<br>
    ・行のラベル（S・A…）をクリックすると名前・色の変更や行の追加・削除ができます<br>
    ・OBS で画像の選択画面が開かない場合は、このページを普通のブラウザで開いて追加してください（すぐ OBS に反映されます）
  </p>
</div>

<div class="pop" id="row-pop" hidden>
  <h3>行の編集 <button class="x" data-close>×</button></h3>
  <div class="f"><span>名前</span><input type="text" id="row-label" maxlength="40"></div>
  <div class="f"><span>色</span><div class="swatches" id="row-colors"></div></div>
  <div class="grid">
    <button class="btn" data-row="up">↑ 上へ移動</button>
    <button class="btn" data-row="down">↓ 下へ移動</button>
    <button class="btn" data-row="addAbove">＋ 上に行を追加</button>
    <button class="btn" data-row="addBelow">＋ 下に行を追加</button>
    <button class="btn" data-row="clear">画像をストックへ戻す</button>
    <button class="btn danger" data-row="delete">この行を削除</button>
  </div>
</div>

<div id="trash">🗑 ここに離すと削除</div>
<div id="drop-cover">画像をドロップして追加</div>
<div id="toast"></div>
<div id="conn"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
'use strict';
// server.js の VERSION と合わせる
const PAGE_VERSION = 10;
const COLORS = ['#ec6b6b', '#f28b2c', '#f5c400', '#b5e533', '#6fdc7f', '#5ccfe6', '#6f9ef0', '#b48cf0', '#f08cd2', '#c8c8c8'];
const IMAGE_SIZE = 300; // 取り込んだ画像はこの大きさの正方形にそろえる

const params = new URLSearchParams(location.search);
const VIEW_ONLY = params.get('view') === '1';
if (params.get('bg') === 'transparent') document.body.classList.add('transparent');
if (VIEW_ONLY) document.body.classList.add('view');

const $ = s => document.querySelector(s);
let T = null; // サーバーから届いたティア表
let pendingT = null; // ドラッグ中に届いた更新（離したあとに反映）
let ws = null;

// ---------------------------------------------------------------------------
// この画面だけの設定（OBS とブラウザで別々に覚える）
// ---------------------------------------------------------------------------
const local = { fit: 'cover', hidePool: false, hideUi: false };
try {
  Object.assign(local, JSON.parse(localStorage.getItem('tierLocal') || '{}'));
} catch (e) {}
function saveLocal() {
  try {
    localStorage.setItem('tierLocal', JSON.stringify(local));
  } catch (e) {}
  applyLocal();
}
function applyLocal() {
  document.body.classList.toggle('pool-hidden', !!local.hidePool);
  document.body.classList.toggle('ui-hidden', !!local.hideUi);
  $('#toggle-pool').textContent = local.hidePool ? '▲ 表示' : '▼ 隠す';
  $('#opt-hide-pool').checked = !!local.hidePool;
  $('#opt-hide-ui').checked = !!local.hideUi;
  document.querySelectorAll('#opt-fit button').forEach(b => b.classList.toggle('on', b.dataset.fit === local.fit));
}
applyLocal();

// ---------------------------------------------------------------------------
// サーバー接続
// ---------------------------------------------------------------------------
let gotTier = false;
function connect() {
  ws = new WebSocket(`ws://${location.host}/`);
  gotTier = false;
  ws.onopen = () => {
    ws.send(JSON.stringify({ cmd: 'hello', role: 'tier' }));
    setTimeout(() => {
      if (!gotTier && ws.readyState === 1) setConn('サーバーが古いバージョンです。start.bat を閉じて起動し直してください');
    }, 3000);
  };
  ws.onmessage = e => {
    let msg;
    try {
      msg = JSON.parse(e.data);
    } catch (err) {
      return;
    }
    if (msg.t === 'tier') {
      gotTier = true;
      setConn('');
      if (msg.version !== undefined && msg.version !== PAGE_VERSION) return reloadForUpdate();
      if (drag) pendingT = msg.tier;
      else {
        T = msg.tier;
        render();
      }
    } else if (msg.t === 'tierError') {
      toast(msg.error);
    }
  };
  ws.onclose = () => {
    setConn('サーバーに接続できません（start.bat を起動してください）');
    setTimeout(connect, 2000);
  };
}
function send(op, data) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ cmd: 'tier', op }, data)));
  else toast('サーバーに接続できていません');
}
function setConn(text) {
  $('#conn').textContent = text;
  $('#conn').classList.toggle('on', !!text);
}
function reloadForUpdate() {
  try {
    if (Date.now() - (Number(sessionStorage.getItem('tierReloadAt')) || 0) < 30000) return;
    sessionStorage.setItem('tierReloadAt', String(Date.now()));
  } catch (e) {}
  const u = new URL(location.href);
  u.searchParams.set('_v', String(Date.now()));
  location.replace(u.toString());
}

let toastTimer = null;
function toast(text, ms = 2500) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => el.classList.remove('on'), ms);
}

// ---------------------------------------------------------------------------
// 描画
// ---------------------------------------------------------------------------
const tiles = new Map(); // 画像ID → タイル要素（使い回してちらつきを防ぐ）

function tileEl(id) {
  let el = tiles.get(id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = id;
    const img = document.createElement('img');
    img.draggable = false;
    img.alt = '';
    el.appendChild(img);
    el.addEventListener('pointerdown', onTileDown);
    tiles.set(id, el);
  }
  const info = T.images[id];
  const src = '/tier-images/' + info.file;
  if (el.firstChild.getAttribute('src') !== src) el.firstChild.src = src;
  el.title = info.name || '';
  return el;
}

function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 110;
}

function render() {
  if (!T) return;
  document.documentElement.style.setProperty('--tile', T.tileSize + 'px');
  $('#title').textContent = T.title || '';

  // 消えた画像のタイルを捨てる
  for (const id of [...tiles.keys()]) if (!T.images[id]) tiles.delete(id);

  const rows = $('#rows');
  rows.textContent = '';
  for (const r of T.rows) {
    const row = document.createElement('div');
    row.className = 'tier';
    row.dataset.row = r.id;
    const label = document.createElement('div');
    const len = [...r.label].length;
    label.className = 'label' + (len > 8 ? ' small' : len > 3 ? ' mid' : '') + (isLight(r.color) ? '' : ' light');
    label.style.background = r.color;
    label.textContent = r.label;
    if (!VIEW_ONLY) label.addEventListener('click', () => openRowPop(r.id, label));
    const items = document.createElement('div');
    items.className = 'items';
    items.dataset.drop = r.id;
    for (const id of r.items) if (T.images[id]) items.appendChild(tileEl(id));
    row.append(label, items);
    rows.appendChild(row);
  }
  const pool = $('#pool');
  pool.textContent = '';
  for (const id of T.pool) if (T.images[id]) pool.appendChild(tileEl(id));
  $('#pool-count').textContent = T.pool.length;

  syncSettings();
  syncRowPop();
}

// ---------------------------------------------------------------------------
// ドラッグ（OBS の「対話」でも動くよう、マウス／ポインターイベントで自前実装）
// ---------------------------------------------------------------------------
let drag = null;

function onTileDown(e) {
  if (VIEW_ONLY || e.button !== 0 || drag) return;
  e.preventDefault();
  const el = e.currentTarget;
  drag = { id: el.dataset.id, el, sx: e.clientX, sy: e.clientY, started: false, ghost: null, ox: 0, oy: 0, trash: false };
}

function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  drag.ox = e.clientX - r.left;
  drag.oy = e.clientY - r.top;
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost');
  g.style.width = r.width + 'px';
  g.style.height = r.height + 'px';
  document.body.appendChild(g);
  drag.ghost = g;
  drag.el.classList.add('placeholder');
  drag.started = true;
  document.body.classList.add('dragging');
  closePops();
}

// 置き場所（行・ストック）の中で、ポインターの位置に入れるときの「この前に入れる」タイル
function insertBeforeTile(container, x, y) {
  for (const t of container.children) {
    if (t === drag.el || !t.classList.contains('tile')) continue;
    const r = t.getBoundingClientRect();
    if (y < r.top) return t;
    if (y <= r.bottom && x < r.left + r.width / 2) return t;
  }
  return null;
}

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    startDrag(e);
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px) scale(1.06)`;

  // 画面の端に来たらスクロール
  if (e.clientY < 30) window.scrollBy(0, -12);
  else if (e.clientY > innerHeight - 30) window.scrollBy(0, 12);

  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const trash = $('#trash');
  drag.trash = !!(hit && hit.closest('#trash'));
  trash.classList.toggle('over', drag.trash);
  if (drag.trash || !hit) return;

  let box = hit.closest('[data-drop]');
  if (!box) {
    const row = hit.closest('.tier');
    if (row) box = row.querySelector('.items');
    else if (hit.closest('#pool-wrap') && !local.hidePool) box = $('#pool');
  }
  if (!box) return;
  const before = insertBeforeTile(box, e.clientX, e.clientY);
  if (drag.el.parentElement !== box || drag.el.nextElementSibling !== before) box.insertBefore(drag.el, before);
});

function endDrag(commit) {
  if (!drag) return;
  const d = drag;
  drag = null;
  document.body.classList.remove('dragging');
  $('#trash').classList.remove('over');
  if (!d.started) return;
  d.ghost.remove();
  d.el.classList.remove('placeholder');

  if (commit && d.trash) {
    // 画面上はすぐ消す（サーバーからの更新で確定）
    removeLocal(d.id);
    delete T.images[d.id];
    pendingT = null;
    send('deleteImage', { id: d.id });
    render();
    return;
  }
  const box = d.el.parentElement;
  if (commit && box && box.dataset.drop) {
    const to = box.dataset.drop;
    const index = [...box.children].filter(c => c.classList.contains('tile')).indexOf(d.el);
    // 先に手元のデータも動かしておく（サーバーからの返事を待たずに表示）
    removeLocal(d.id);
    const list = to === 'pool' ? T.pool : (T.rows.find(r => r.id === to) || {}).items;
    if (list) list.splice(index, 0, d.id);
    pendingT = null;
    send('move', { id: d.id, to, index });
  }
  if (pendingT) {
    T = pendingT;
    pendingT = null;
  }
  render();
}
function removeLocal(id) {
  T.pool = T.pool.filter(x => x !== id);
  for (const r of T.rows) r.items = r.items.filter(x => x !== id);
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));
window.addEventListener('blur', () => endDrag(false));
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    endDrag(false);
    closePops();
  }
});

// ---------------------------------------------------------------------------
// 画像の追加（正方形に加工してからサーバーへ送る）
// ---------------------------------------------------------------------------
function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('画像を読み込めませんでした'));
    img.src = url;
  });
}

async function toSquare(file, fit) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error('画像の大きさが分かりません');
    const c = document.createElement('canvas');
    c.width = c.height = IMAGE_SIZE;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (fit === 'contain') {
      const k = IMAGE_SIZE / Math.max(w, h);
      const dw = w * k, dh = h * k;
      ctx.drawImage(img, (IMAGE_SIZE - dw) / 2, (IMAGE_SIZE - dh) / 2, dw, dh);
    } else {
      const s = Math.min(w, h);
      ctx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, IMAGE_SIZE, IMAGE_SIZE);
    }
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.9));
    if (blob && blob.type === 'image/webp') return blob;
    return await new Promise(r => c.toBlob(r, 'image/png'));
  } finally {
    URL.revokeObjectURL(url);
  }
}

let uploading = false;
async function addFiles(files) {
  const list = [...files].filter(f => f && (f.type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(f.name || '')));
  if (!list.length) return toast('画像ファイルが見つかりませんでした');
  if (uploading) return toast('追加中です。少し待ってからもう一度どうぞ');
  uploading = true;
  let ok = 0;
  const errors = [];
  try {
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      toast(`画像を追加中… ${i + 1} / ${list.length}`, 0);
      try {
        const blob = await toSquare(f, local.fit);
        const name = (f.name || '').replace(/\.[^.]+$/, '');
        const res = await fetch('/tier/upload?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
        const j = await res.json().catch(() => ({ ok: false, error: 'サーバーが古いバージョンです。再起動してください' }));
        if (!j.ok) throw new Error(j.error || '追加できませんでした');
        ok++;
      } catch (e) {
        errors.push(`${f.name || '画像'}：${e.message}`);
      }
    }
  } finally {
    uploading = false;
  }
  if (errors.length) toast(`${ok}枚追加しました。追加できなかった画像があります → ${errors[0]}`, 6000);
  else toast(`${ok}枚追加しました（ストックに入っています）`);
}

$('#file').addEventListener('change', e => {
  addFiles(e.target.files);
  e.target.value = '';
});
function pickFiles() {
  $('#file').click();
}
$('#add-image').addEventListener('click', pickFiles);
$('#opt-add-image').addEventListener('click', pickFiles);

// パソコンのフォルダから画面へドラッグ＆ドロップ
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => {
  if (VIEW_ONLY || !hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  $('#drop-cover').classList.add('on');
});
window.addEventListener('dragover', e => {
  if (!VIEW_ONLY && hasFiles(e)) e.preventDefault();
});
window.addEventListener('dragleave', e => {
  if (!hasFiles(e)) return;
  if (--dragDepth <= 0) {
    dragDepth = 0;
    $('#drop-cover').classList.remove('on');
  }
});
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop-cover').classList.remove('on');
  if (!VIEW_ONLY) addFiles(e.dataTransfer.files);
});
// Ctrl+V で画像を貼り付け
window.addEventListener('paste', e => {
  if (VIEW_ONLY) return;
  const files = [...((e.clipboardData && e.clipboardData.items) || [])]
    .filter(i => i.kind === 'file' && i.type.startsWith('image/'))
    .map(i => i.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  addFiles(files);
});

// ---------------------------------------------------------------------------
// 設定・行の編集（吹き出し）
// ---------------------------------------------------------------------------
function closePops() {
  $('#settings').hidden = true;
  $('#row-pop').hidden = true;
  rowPopId = null;
  disarmAll();
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closePops));
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.pop, #gear, .label')) return;
  if (!$('#settings').hidden || !$('#row-pop').hidden) closePops();
});

function placePop(pop, anchor) {
  pop.hidden = false;
  const a = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = a.right + 8;
  if (left + w > innerWidth - 8) left = Math.max(8, a.left - w - 8);
  let top = Math.min(a.top, innerHeight - h - 8);
  pop.style.left = left + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}

// 2回押しで実行するボタン（確認ダイアログは OBS で出ないため）
function armed(btn, text, fn) {
  if (btn.classList.contains('armed')) {
    disarmAll();
    fn();
    return;
  }
  disarmAll();
  btn.dataset.text = btn.textContent;
  btn.textContent = text;
  btn.classList.add('armed');
  btn._t = setTimeout(() => disarm(btn), 3000);
}
function disarm(btn) {
  clearTimeout(btn._t);
  btn.classList.remove('armed');
  if (btn.dataset.text) btn.textContent = btn.dataset.text;
}
function disarmAll() {
  document.querySelectorAll('.armed').forEach(disarm);
}

// ---- 全体の設定 ----
$('#gear').addEventListener('click', () => {
  if (!$('#settings').hidden) return closePops();
  closePops();
  syncSettings(true);
  const pop = $('#settings');
  pop.hidden = false;
  pop.style.left = Math.max(8, innerWidth - pop.offsetWidth - 12) + 'px';
  pop.style.top = '50px';
});
function syncSettings(force) {
  if (!T) return;
  const title = $('#opt-title');
  if (force || document.activeElement !== title) title.value = T.title || '';
  const size = $('#opt-size');
  if (force || document.activeElement !== size) size.value = T.tileSize;
  $('#opt-size-v').textContent = size.value;
}
let titleTimer = null;
$('#opt-title').addEventListener('input', e => {
  $('#title').textContent = e.target.value;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => send('setOptions', { title: e.target.value }), 300);
});
$('#opt-size').addEventListener('input', e => {
  $('#opt-size-v').textContent = e.target.value;
  document.documentElement.style.setProperty('--tile', e.target.value + 'px');
});
$('#opt-size').addEventListener('change', e => send('setOptions', { tileSize: Number(e.target.value) }));
document.querySelectorAll('#opt-fit button').forEach(b =>
  b.addEventListener('click', () => {
    local.fit = b.dataset.fit;
    saveLocal();
  })
);
$('#opt-hide-pool').addEventListener('change', e => {
  local.hidePool = e.target.checked;
  saveLocal();
});
$('#opt-hide-ui').addEventListener('change', e => {
  local.hideUi = e.target.checked;
  saveLocal();
});
$('#toggle-pool').addEventListener('click', () => {
  local.hidePool = !local.hidePool;
  saveLocal();
});
$('#opt-add-row').addEventListener('click', () => send('addRow', {}));
$('#add-row').addEventListener('click', () => send('addRow', {}));
$('#opt-reset').addEventListener('click', e => armed(e.currentTarget, 'もう一度押すと戻します', () => send('resetAll', {})));
$('#opt-delete-all').addEventListener('click', e =>
  armed(e.currentTarget, 'もう一度押すと全部削除', () => send('deleteAllImages', {}))
);

// ---- 行の編集 ----
let rowPopId = null;
const rowColors = $('#row-colors');
rowColors.innerHTML =
  COLORS.map(c => `<button data-color="${c}" style="background:${c}" title="${c}"></button>`).join('') +
  '<input type="color" id="row-color-custom" title="好きな色">';
rowColors.addEventListener('click', e => {
  const b = e.target.closest('button[data-color]');
  if (b && rowPopId) send('updateRow', { id: rowPopId, color: b.dataset.color });
});
$('#row-color-custom').addEventListener('input', e => {
  if (rowPopId) send('updateRow', { id: rowPopId, color: e.target.value });
});

function openRowPop(id, labelEl) {
  if (rowPopId === id && !$('#row-pop').hidden) return closePops();
  closePops();
  rowPopId = id;
  syncRowPop(true);
  placePop($('#row-pop'), labelEl);
}
function syncRowPop(force) {
  if (!rowPopId || !T) return;
  const r = T.rows.find(x => x.id === rowPopId);
  if (!r) return closePops();
  const input = $('#row-label');
  if (force || document.activeElement !== input) input.value = r.label;
  rowColors.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.color === r.color));
  if (document.activeElement !== $('#row-color-custom')) $('#row-color-custom').value = r.color;
}
let labelTimer = null;
$('#row-label').addEventListener('input', e => {
  const id = rowPopId;
  const value = e.target.value;
  clearTimeout(labelTimer);
  labelTimer = setTimeout(() => send('updateRow', { id, label: value }), 250);
});
$('#row-label').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(labelTimer);
    send('updateRow', { id: rowPopId, label: e.target.value });
    closePops();
  }
});
document.querySelectorAll('[data-row]').forEach(b =>
  b.addEventListener('click', e => {
    const id = rowPopId;
    if (!id || !T) return;
    const at = T.rows.findIndex(r => r.id === id);
    switch (b.dataset.row) {
      case 'up':
        return send('moveRow', { id, dir: -1 });
      case 'down':
        return send('moveRow', { id, dir: 1 });
      case 'addAbove':
        return send('addRow', { at, label: '新しい行' });
      case 'addBelow':
        return send('addRow', { at: at + 1, label: '新しい行' });
      case 'clear':
        return send('clearRow', { id });
      case 'delete':
        return armed(e.currentTarget, 'もう一度押すと削除', () => {
          send('deleteRow', { id });
          closePops();
        });
    }
  })
);

connect();
</script>
</body>
