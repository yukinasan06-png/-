<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カウンター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; color: #6b4a5c; padding: 12px; }
  #list { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #list.row { flex-direction: row; flex-wrap: wrap; }
  .item {
    --c: #ff8fbd; --soft: #ffe6f0;
    display: flex; align-items: center; gap: 10px; min-width: 250px;
    background: rgba(255, 255, 255, .92); border: 3px solid var(--c);
    border-radius: 999px; padding: 4px 20px 4px 4px;
    box-shadow: 0 4px 0 var(--soft), 0 6px 14px rgba(0, 0, 0, .15);
  }
  .item .icon {
    width: 44px; height: 44px; border-radius: 50%; background: var(--soft);
    display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none;
  }
  .item .name { font-size: 19px; font-weight: 800; flex: 1; white-space: nowrap; }
  .item .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c); -webkit-text-stroke: 1px rgba(0,0,0,.05); }
  .item .sub { font-size: 13px; color: #b08ba0; margin-left: 4px; }
  .item.pop .val { animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); display: inline-block; }
  .item.pop .icon { animation: wiggle .6s; }
  @keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  @keyframes wiggle { 25% { transform: rotate(-15deg) scale(1.15); } 75% { transform: rotate(15deg) scale(1.15); } }
  /* 横並び（?layout=row）は正方形タイル */
  #list.row .item {
    flex-direction: column; justify-content: center; gap: 2px; min-width: 0; width: 130px; height: 130px;
    border-radius: 26px; padding: 8px; text-align: center;
  }
  #list.row .item .icon { width: 38px; height: 38px; font-size: 21px; }
  #list.row .item .name { flex: none; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  #list.row .item .val { font-size: 32px; line-height: 1.1; }
  #list.row .item .sub { display: block; margin: 0; font-size: 11px; }
  .item:nth-child(6n+1) { --c: #ff7eb3; --soft: #ffe0ee; }
  .item:nth-child(6n+2) { --c: #f5a623; --soft: #fff0d4; }
  .item:nth-child(6n+3) { --c: #45c2a4; --soft: #daf5ee; }
  .item:nth-child(6n+4) { --c: #5aa7f5; --soft: #dfeeff; }
  .item:nth-child(6n+5) { --c: #a283ff; --soft: #ece5ff; }
  .item:nth-child(6n+6) { --c: #ff8a75; --soft: #ffe7e2; }
</style>
</head>
<body>
<div id="list"></div>
<script src="/connector.js"></script>
<script src="/overlay/common.js"></script>
<script>
  const ICONS = { viewers: '👀', likes: '💗', superchat: '💰', first: '🌱', comments: '💬', gift: '🎁', keyword: '✨' };
  const ids = (params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  const showAmount = params.get('amount') !== '0';
  const showPeak = params.get('peak') !== '0';
  const list = document.getElementById('list');
  if (params.get('layout') === 'row') list.classList.add('row');
  let keys = '';
  subscribe(S => {
    let items = S.items.filter(it => it.kind === 'auto' || it.enabled);
    if (ids.length) items = ids.map(id => items.find(i => i.id === id)).filter(Boolean);
    else items = items.filter(i => i.show);
    const k = items.map(i => i.id).join(',');
    if (k !== keys) {
      keys = k;
      list.innerHTML = items.map(i => `<div class="item" data-id="${i.id}"><span class="icon">${ICONS[i.id] || '⭐'}</span><span class="name"></span><span class="val"></span></div>`).join('');
    }
    for (const it of items) {
      const el = list.querySelector(`[data-id="${it.id}"]`);
      el.querySelector('.name').textContent = it.name;
      const v = el.querySelector('.val');
      let html = fmt(it.value);
      if (it.id === 'superchat' && showAmount && it.amount) html += `<span class="sub">¥${fmt(it.amount)}</span>`;
      if (it.id === 'viewers' && showPeak && it.peak) html += `<span class="sub">最高 ${fmt(it.peak)}</span>`;
      if (v.innerHTML !== html) {
        const had = v.innerHTML !== '';
        v.innerHTML = html;
        if (had) {
          el.classList.remove('pop');
          void el.offsetWidth;
          el.classList.add('pop');
        }
      }
    }
  });
</script>
</body>
</html>
