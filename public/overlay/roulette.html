<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ルーレット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; color: #6b4a5c; }
  #stage { display: flex; flex-direction: column; align-items: center; padding: 10px; transition: opacity .6s, transform .6s cubic-bezier(.3, 1.4, .5, 1); }
  #stage.hidden { opacity: 0; transform: scale(.7) rotate(-6deg); }
  .tpl {
    font-size: 20px; font-weight: 800; color: #ff6fa8; margin-bottom: 26px; min-height: 30px;
    background: #fff; border: 3px solid #ffb3d1; border-radius: 999px; padding: 2px 18px; box-shadow: 0 3px 0 #ffd6e7;
  }
  .tpl:empty { visibility: hidden; }
  .tpl::before { content: "🎀 "; }
  .wheel-wrap { position: relative; }
  canvas { display: block; filter: drop-shadow(0 8px 10px rgba(200, 90, 140, .3)); }
  .pointer {
    position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 46px; line-height: 1;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.2));
  }
  .pointer::before { content: "💗"; display: block; }
  .pointer::after {
    content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
    border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 16px solid #ff6fa8;
  }
  .result {
    margin-top: 14px; font-size: 32px; font-weight: 800; padding: 8px 30px; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, #ff9ac4, #c7a6ff); border: 4px solid #fff;
    box-shadow: 0 5px 0 #f3b7d3, 0 8px 18px rgba(200, 90, 160, .35); text-shadow: 0 2px 0 rgba(160, 60, 120, .35);
    opacity: 0; transform: scale(.4); transition: opacity .3s, transform .5s cubic-bezier(.2, 1.8, .4, 1);
    max-width: 90vw; text-align: center; word-break: break-all;
  }
  .result::before { content: "🎉 "; }
  .result::after { content: " 🎉"; }
  .result.show { opacity: 1; transform: scale(1); }
  .preview-note { position: fixed; top: 4px; left: 6px; font-size: 11px; color: #c9a3b8; }
</style>
</head>
<body>
<div id="stage" class="hidden">
  <div class="tpl" id="tpl"></div>
  <div class="wheel-wrap">
    <canvas id="c"></canvas>
    <div class="pointer"></div>
  </div>
  <div class="result" id="result"></div>
</div>
<script src="/connector.js"></script>
<script src="/overlay/common.js"></script>
<script src="/sound.js"></script>
<script>
  const preview = params.get('preview') === '1';
  const soundOn = params.get('sound') !== '0' && !preview;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let size = 0;
  function setupCanvas() {
    size = preview
      ? Math.max(120, Math.floor(Math.min(window.innerWidth, window.innerHeight * 0.78) - 20))
      : Math.max(120, Number(params.get('size')) || 520);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();
  window.addEventListener('resize', () => {
    setupCanvas();
    draw();
  });
  const stage = document.getElementById('stage');
  const resultEl = document.getElementById('result');
  const tplEl = document.getElementById('tpl');

  const COLORS = ['#ffb3d1', '#ffe08a', '#b5ecd9', '#bcdcff', '#d9c8ff', '#ffc9b8', '#fff1a8', '#c8f0c4'];
  let items = [];
  let rot = 0; // ラジアン。0 のとき項目0の始まりが真上
  let anim = null;
  let currentSpinId = null;
  let S = null;
  let hideTimer = null;

  // ------ 効果音（public/sound.js）。プレビューと ?sound=0 のときは鳴らさない ------
  if (!preview) Sound.onReport(r => Hub.send(Object.assign({ cmd: 'soundReport' }, r)));

  function soundOpts() {
    const o = (S && S.roulette.options) || {};
    return soundOn ? o : Object.assign({}, o, { soundOn: false });
  }

  // ------ 描画 ------
  function draw() {
    const r = size / 2;
    ctx.clearRect(0, 0, size, size);
    const n = items.length;
    if (!n) {
      ctx.fillStyle = '#fff0f6';
      ctx.beginPath();
      ctx.arc(r, r, r - 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e0659b';
      ctx.font = `bold ${Math.round(size / 16)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('項目がありません', r, r);
      return;
    }
    const seg = (Math.PI * 2) / n;
    const fontSize = Math.max(11, Math.min(size / 14, (size / n) * 1.1));
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + rot + i * seg;
      ctx.beginPath();
      ctx.moveTo(r, r);
      ctx.arc(r, r, r - 6, a0, a0 + seg);
      ctx.closePath();
      let color = COLORS[i % COLORS.length];
      if (n % COLORS.length === 1 && i === n - 1) color = COLORS[(i + 2) % COLORS.length]; // 隣同士の同色を避ける
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(r, r);
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#6b4a5c';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      let label = String(items[i]);
      const maxW = r * 0.72;
      // 長い項目はまず文字を小さくし、それでも入らなければ省略
      let fs = fontSize;
      const setFont = () => (ctx.font = `bold ${fs}px "M PLUS Rounded 1c", "Yu Gothic UI", Meiryo, sans-serif`);
      setFont();
      while (ctx.measureText(label).width > maxW && fs > fontSize * 0.55) {
        fs -= 1;
        setFont();
      }
      while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
      if (label !== String(items[i])) label = label.slice(0, -1) + '…';
      ctx.strokeText(label, r - Math.max(8, size * 0.03) - 14, 0);
      ctx.fillText(label, r - Math.max(8, size * 0.03) - 14, 0);
      ctx.restore();
    }
    // 外枠（ピンクのふち＋白いドット）と中心のハート
    const rim = Math.max(8, size * 0.03);
    ctx.beginPath();
    ctx.arc(r, r, r - rim / 2 - 1, 0, Math.PI * 2);
    ctx.lineWidth = rim;
    ctx.strokeStyle = '#ff8fbd';
    ctx.stroke();
    const dots = 24;
    for (let i = 0; i < dots; i++) {
      const a = (i / dots) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(r + Math.cos(a) * (r - rim / 2 - 1), r + Math.sin(a) * (r - rim / 2 - 1), rim * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#fff' : '#fff3b0';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(r, r, size * 0.085, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffb3d1';
    ctx.stroke();
    ctx.font = `${Math.round(size * 0.09)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💖', r, r + size * 0.005);
  }

  function indexAtPointer() {
    const n = items.length;
    const seg = (Math.PI * 2) / n;
    const a = (((-rot) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / seg) % n;
  }

  function show() {
    clearTimeout(hideTimer);
    stage.classList.remove('hidden');
  }
  function hideLater(ms) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!alwaysShow()) stage.classList.add('hidden');
      resultEl.classList.remove('show');
    }, ms);
  }
  function alwaysShow() {
    return preview || (S && S.roulette.options.alwaysShow);
  }

  function startSpin(sp) {
    if (currentSpinId === sp.id) return;
    currentSpinId = sp.id;
    items = sp.items;
    tplEl.textContent = sp.template;
    resultEl.classList.remove('show');
    show();
    const n = items.length;
    const seg = (Math.PI * 2) / n;
    const elapsed = (Date.now() - sp.startedAt) / 1000;
    const duration = Math.max(0.1, sp.duration - elapsed);
    Sound.start(soundOpts(), duration * 1000 + 300);
    // 目標: 当選項目の範囲内（端を避けたランダム位置）が真上に来る回転量
    const jitter = (Math.random() * 0.7 + 0.15) * seg;
    const targetMod = (((-(sp.index * seg + jitter)) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const start = rot;
    const startMod = ((start % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = targetMod - startMod;
    if (delta < 0) delta += Math.PI * 2;
    const turns = Math.max(2, Math.round(duration * 1.2));
    const end = start + delta + turns * Math.PI * 2;
    const t0 = performance.now();
    let lastIdx = -1;
    cancelAnimationFrame(anim);
    const step = now => {
      const t = Math.min(1, (now - t0) / (duration * 1000));
      const e = 1 - Math.pow(1 - t, 4); // easeOutQuart
      rot = start + (end - start) * e;
      draw();
      const idx = indexAtPointer();
      if (idx !== lastIdx) {
        if (lastIdx !== -1) Sound.tick(soundOpts());
        lastIdx = idx;
      }
      if (t < 1) anim = requestAnimationFrame(step);
      else finish(sp);
    };
    anim = requestAnimationFrame(step);
    // 画面が見えていない（アニメーションが止まる）ときでも、時間が来たら必ず結果にする
    clearTimeout(finishTimer);
    finishTimer = setTimeout(() => {
      if (finishedId === sp.id) return;
      cancelAnimationFrame(anim);
      rot = end;
      draw();
      finish(sp);
    }, duration * 1000 + 250);
  }

  let finishTimer = null;
  let finishedId = null;

  function finish(sp, silent) {
    if (finishedId === sp.id) return;
    finishedId = sp.id;
    clearTimeout(finishTimer);
    resultEl.textContent = sp.result;
    resultEl.classList.add('show');
    if (!silent) Sound.result(soundOpts());
    const remain = sp.startedAt + (sp.duration + sp.hold) * 1000 - Date.now();
    hideLater(Math.max(1500, remain));
  }

  function idleItems() {
    const R = S.roulette;
    return R.templates[R.active].items;
  }

  subscribe(
    state => {
      S = state;
      const sp = S.roulette.spinning;
      if (sp && sp.id !== currentSpinId) {
        if (sp.done) {
          // 読み込み時にすでに止まっていた場合
          currentSpinId = sp.id;
          items = sp.items;
          const seg = (Math.PI * 2) / items.length;
          rot = -(sp.index + 0.5) * seg;
          tplEl.textContent = sp.template;
          draw();
          show();
          finish(sp, true);
        } else {
          startSpin(sp);
        }
        return;
      }
      if (!sp) Sound.stopBgm(); // 念のため：ルーレットが終わっていたら BGM を止める
      if (!sp && !anim_running()) {
        // 待機中はテンプレの内容を表示
        const list = idleItems();
        if (JSON.stringify(list) !== JSON.stringify(items)) {
          items = list;
          draw();
        }
        tplEl.textContent = S.roulette.templates[S.roulette.active].name;
        if (alwaysShow()) show();
        else if (!resultEl.classList.contains('show')) stage.classList.add('hidden');
      }
    },
    ev => {
      if (ev.type === 'spin') startSpin(ev.spin);
    }
  );

  function anim_running() {
    return S && S.roulette.spinning && !S.roulette.spinning.done;
  }

  if (preview) {
    stage.classList.remove('hidden');
    document.body.insertAdjacentHTML('beforeend', '<div class="preview-note">プレビュー</div>');
  }
  draw();
</script>
</body>
</html>
